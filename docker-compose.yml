version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hotel_erp_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hotel_erp_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hotel_net

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hotel_erp_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=hotel_erp_db
      - PAYMENT_PROVIDER=mock
      - JWT_SECRET=super_secret_hospitality_erp_jwt_key_change_in_production_2026
      - CORS_ORIGINS=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hotel_net

  # 3. React Vite + Nginx Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hotel_erp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hotel_net

volumes:
  mongo_data:
    driver: local

networks:
  hotel_net:
    driver: bridge
